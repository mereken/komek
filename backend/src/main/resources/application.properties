# API port (default changed from 8080 to avoid clashes). If you change it, also change frontend/vite.config.ts
server.port=${SERVER_PORT:18080}

# PostgreSQL in Docker is published on host port 15432
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/komek}
spring.datasource.username=${DB_USER:komek}
spring.datasource.password=${DB_PASSWORD:komek}

# Creates/updates tables automatically (users, tasks, task_responses)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT secret must be at least 32 characters. Override with env var outside local development.
app.jwt.secret=${JWT_SECRET:komek-dev-secret-change-me-please-32chars}
app.jwt.expiration-ms=86400000

# No real SMS/e-mail provider yet. While true, the code is also returned in the API response
# (the app shows it on screen) and printed in the backend console. Set to false in production.
app.otp.expose-code=${OTP_EXPOSE_CODE:true}
